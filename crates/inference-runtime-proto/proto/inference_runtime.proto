syntax = "proto3";

package psi_dec.inference.v1;

service InferenceRuntime {
  rpc Decode(DecodeRequest) returns (stream DecodeResponse);
}

message DecodeRequest {
  repeated uint32 tokens = 1;
  uint32 max_sampled_tokens = 2;
  repeated TokenSequence stop_sequences = 3;
  optional float temperature = 4;
  optional uint32 top_k = 5;
  optional float top_p = 6;
  optional uint32 seed = 7;
}

message TokenSequence {
  repeated uint32 tokens = 1;
}

message DecodeResponse {
  uint64 request_id = 1;
  oneof event {
    DecodeChunk chunk = 2;
    DecodeCompletion completion = 3;
  }
}

message DecodeChunk {
  repeated uint32 tokens = 1;
  repeated float probs = 2;
}

message DecodeCompletion {
  CompletionReason reason = 1;
  uint64 num_output_tokens = 2;
}

enum CompletionReason {
  COMPLETION_REASON_UNSPECIFIED = 0;
  COMPLETION_REASON_STOP_SEQUENCE = 1;
  COMPLETION_REASON_LENGTH_LIMIT = 2;
  COMPLETION_REASON_CONTEXT_LIMIT = 3;
}
